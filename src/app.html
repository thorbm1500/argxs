<!doctype html>
<html lang="en">
	<head>
		<title>argxs ▪ Web Resources</title>
		<meta name="application-name" content="argxs" />
		<meta name="description" content="[Human-Made] Your #1 source of Web Development resources!" />
		<meta name="keywords" content="Open-Source, Web Development, Web Resources, Development Resources, Development Tools">
		<link rel="icon" type="image/svg" href="/favicon.svg" />
		<meta charset="utf-8" name="viewport" content="width=device-width, initial-scale=1" />
		<meta property="og:site_name" content="argxs" />
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://argxs.dev" />
		<meta property="og:title" content="argxs" />
		<meta property="og:description" content="Your #1 source of Web Development resources!" />
		<meta property="og:image" content="https://cdn.argxs.dev/embed/banner.png" />
		<meta property="og:image:secure_url" content="https://cdn.argxs.dev/embed/banner.png" />
		<meta property="og:image:alt" content="argxs.dev" />
		<meta property="og:locale" content="en_US">
		<meta property="twitter:url" content="https://argxs.dev" />
		<meta property="twitter:title" content="argxs" />
		<meta property="twitter:description" content="Your #1 source of Web Development resources!" />
		<meta property="twitter:image" content="https://cdn.argxs.dev/embed/banner.png" />
		<meta property="twitter:image:alt" content="argxs.dev" />
		<meta name="format-detection" content="telephone=no">
		<link rel="license" href="https://cdn.argxs.dev/LICENSE">
		<link rel="privacy-policy" href="/privacy">
		%sveltekit.head%
	</head>
	<svg style="display: none;">
		<defs>
			<filter id="svt-glass-button-distortion-filter" x="0%" y="0%" width="200%" height="200%">
				<feTurbulence type="fractalNoise" baseFrequency="0.001 0.001" numOctaves="4" result="noise" />
				<feGaussianBlur in="noise" stdDeviation="2" result="blurred" />
				<feDisplacementMap in="SourceGraphic" in2="blurred" scale="20" xChannelSelector="R" yChannelSelector="G" />
			</filter>
			<filter id="svt-glass-button-morph-filter" color-interpolation-filters="linearRGB" filterUnits="objectBoundingBox" primitiveUnits="userSpaceOnUse">
				<feMorphology operator="dilate" radius="1 1" x="0%" y="0%" width="100%" height="100%" in="SourceGraphic" result="morphology" />
				<!--suppress HtmlUnknownAttribute - edgeMode is a legal attribute for feGaussianBlur, but is giving an error, hence the suppression -->
				<feGaussianBlur stdDeviation="0 1" x="0%" y="0%" width="100%" height="100%" in="SourceGraphic" edgeMode="none" result="blur" />
			</filter>
			<filter id="svt-glass-button-blur-filter" color-interpolation-filters="linearRGB" filterUnits="objectBoundingBox" primitiveUnits="userSpaceOnUse">
				<!--suppress HtmlUnknownAttribute - edgeMode is a legal attribute for feGaussianBlur, but is giving an error, hence the suppression -->
				<feGaussianBlur stdDeviation="1 1" x="0%" y="0%" width="100%" height="100%" in="SourceGraphic" edgeMode="none" result="blur" />
			</filter>
			<filter id="icon-glass-distortion" x="0%" y="0%" width="100%" height="100%">
				<feTurbulence type="fractalNoise" baseFrequency="0.007 0.007" numOctaves="3" result="noise" />
				<feGaussianBlur in="noise" stdDeviation="4" result="blurred" />
				<feDisplacementMap in="SourceGraphic" in2="blurred" scale="15" xChannelSelector="R" yChannelSelector="G" />
			</filter>
			<filter id="pixelate" x="0%" y="0%" width="100%" height="100%">
				<!--Thanks to Zoltan Fegyver for figuring out pixelation and producing the awesome pixelation map. -->
				<feGaussianBlur stdDeviation="2" in="SourceGraphic" result="smoothed" />
				<feImage width="15" height="15"
				         xlink:href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAUAAAAFCAIAAAACDbGyAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAADsMAAA7DAcdvqGQAAAAWSURBVAgdY1ywgOEDAwKxgJhIgFQ+AP/vCNK2s+8LAAAAAElFTkSuQmCC"
				         result="displacement-map" />
				<feTile in="displacement-map" result="pixelate-map" />
				<feDisplacementMap in="smoothed" in2="pixelate-map" xChannelSelector="R" yChannelSelector="G" scale="5" result="pre-final" />
				<feComposite operator="in" in2="SourceGraphic" />
			</filter>
		</defs>
	</svg>
	<body data-sveltekit-preload-data="hover">
		<div>%sveltekit.body%</div>
	</body>
</html>
